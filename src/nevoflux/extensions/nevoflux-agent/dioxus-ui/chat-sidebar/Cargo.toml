[package]
name = "chat-sidebar"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "NevoFlux Chat Sidebar - Dioxus WASM UI for browser sidebar"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared-protocol = { path = "../shared-protocol" }
markdown-render = { path = "../markdown-render" }
dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Navigator", "Clipboard", "Storage"] }
gloo.workspace = true
gloo-utils.workspace = true
futures.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-wasm.workspace = true
console_error_panic_hook = "0.1"

# QR for the pairing link (design §12.3). Generated here rather than in the
# daemon: the headless head prints to a pipe and cannot show a picture, so a QR
# would serve exactly one of the two callers and has no business in the code
# they share. Pure Rust, no renderer of its own — it emits the SVG we inline.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"

[features]
default = []
